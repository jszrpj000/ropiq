<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ropiq 是一个独立的对话式生成工作流智能体。">
  <title>Ropiq</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><strong>Ropiq</strong><small>生成工作流智能体</small></div>
      </div>

      <button id="new-chat" class="new-session"><span>＋</span> 新建会话</button>

      <div class="rail-section">
        <p class="rail-label">快捷指令</p>
        <nav class="quick-actions" aria-label="快捷指令">
          <button data-prompt="检查当前生成环境状态"><span>01</span>环境状态</button>
          <button data-prompt="查看当前执行队列"><span>02</span>执行队列</button>
          <button data-prompt="列出当前可用模型，并按用途分组"><span>03</span>模型能力</button>
          <button data-prompt="释放显存"><span>04</span>释放显存</button>
        </nav>
      </div>

      <div class="connection-card">
        <p class="rail-label">连接</p>
        <div><span id="backend-dot" class="status-dot"></span><span id="backend-status">生成后端检查中</span></div>
        <div><span id="llm-dot" class="status-dot"></span><span id="llm-status">模型接口检查中</span></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <span class="header-kicker">STUDIO</span>
          <strong>创作会话</strong>
        </div>
        <div class="header-meta">
          <span id="model-label">未配置模型</span>
          <span class="guard-badge"><i></i>本地校验 · 人工确认</span>
        </div>
      </header>

      <section id="conversation" class="conversation" aria-live="polite">
        <article class="message assistant welcome">
          <div class="assistant-mark">R</div>
          <div class="message-body">
            <span class="message-label">ROPIQ</span>
            <h1>把结果说清楚，流程交给我。</h1>
            <p>我会读取你已连接环境中的节点、模型和资源，生成候选工作流，先在本地校验，再交给你确认执行。</p>
            <div class="prompt-examples">
              <button data-prompt="为一张产品照片设计干净的棚拍增强方案，保持主体结构不变">产品图增强</button>
              <button data-prompt="设计一个竖屏五秒镜头，节奏平稳，优先保证主体一致性">竖屏短镜头</button>
              <button data-prompt="分析当前环境适合运行哪些工作流，并说明显存风险">环境能力分析</button>
            </div>
          </div>
        </article>
      </section>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="描述你想得到的画面、视频或处理结果…" required></textarea>
        <button id="send" type="submit" aria-label="发送">↗</button>
        <div class="composer-footer">
          <span>Enter 发送 · Shift + Enter 换行</span>
          <span>执行前始终需要确认</span>
        </div>
      </form>
    </main>

    <aside class="context-panel">
      <div class="context-head">
        <span class="header-kicker">CONTEXT</span>
        <h2>运行上下文</h2>
        <p>信息只来自你主动连接的本地环境。</p>
      </div>
      <section>
        <h3>环境摘要</h3>
        <div id="environment" class="environment"><p class="muted">正在读取…</p></div>
      </section>
      <section>
        <h3>已授权素材</h3>
        <div id="assets" class="asset-list"><p class="muted">正在读取…</p></div>
      </section>
      <div class="privacy-note"><span>LOCAL</span> 默认仅监听 127.0.0.1，不上传密钥和运行记录。</div>
    </aside>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
